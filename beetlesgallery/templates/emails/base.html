<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f2f2f2;font-family:Helvetica,Arial,sans-serif;color:#222222;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f2;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #dddddd;border-radius:8px;">
        <tr><td style="padding:20px 28px;border-bottom:1px solid #e5e5e5;font-size:15px;font-weight:bold;letter-spacing:0.3px;color:#111111;">
          Bark &amp; Ambrosia Beetle Gallery
        </td></tr>
        <tr><td style="padding:24px 28px;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #e5e5e5;font-size:12px;line-height:1.5;color:#777777;">
          {% block footer %}You are receiving this email because of your account at the Bark &amp; Ambrosia Beetle Gallery.{% endblock %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
