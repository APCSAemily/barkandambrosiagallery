{# A download for signed-in users; everyone else is sent to sign in first. Needs: name, ext, label; optional: css, title #}
{% if user.is_authenticated %}
<a href="{% url 'interactions_download' name ext %}" class="{{ css|default:'btn-download' }}" title="{{ title|default:label }}">
  {% if not css %}<i class="fi fi-rr-download text-gray-500"></i>{% endif %}<span>{{ label }}</span>
</a>
{% else %}
<a href="{% url 'login' %}?next={{ request.path|urlencode }}" class="{{ css|default:'btn-download' }}" title="Sign in to download">
  {% if not css %}<i class="fi fi-rr-lock text-gray-500"></i>{% endif %}<span>{{ label }}{% if not css %} (sign in){% endif %}</span>
</a>
{% endif %}
