{# The link to the game's GitHub Discussions category, for bugs and ideas. Needs ``discussions`` in the context. #}
<a href="{{ discussions }}" target="_blank" rel="noopener" class="mt-8 flex items-center gap-3 px-4 py-3 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50" data-testid="discussions-link">
  <i class="fi fi-rr-comment-alt text-gray-500"></i>
  <span class="flex-1">Found a bug or have an idea for the game? <span class="underline">Tell us on GitHub Discussions</span></span>
  <i class="fi fi-rr-arrow-up-right-from-square text-gray-400"></i>
</a>
