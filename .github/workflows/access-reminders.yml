name: Access request reminders

# Once a day, email the approvers a list of access requests that are still waiting for a decision.
# It sends nothing when nobody is waiting. Run it by hand from the Actions tab to test it.
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    name: Remind the approvers
    runs-on: ubuntu-latest
    steps:
      - name: Run the reminder on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/barkandambrosiagallery || exit 1
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pixi run remind-access
